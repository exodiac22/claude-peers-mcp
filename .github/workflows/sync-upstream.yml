name: Sync Fork with Upstream

on:
  schedule:
    - cron: '17 4 * * 0'  # Sunday 4:17am UTC (offset from :00)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              });
              console.log('Fork synced successfully with upstream');
            } catch (error) {
              if (error.status === 409) {
                console.log('Merge conflict — creating PR for manual review');
                await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '[Auto] Sync upstream — conflict needs review',
                  head: 'upstream-sync',
                  base: 'main',
                  body: 'Upstream (louislva/claude-peers-mcp) has changes that conflict with local patches. Manual resolution required.'
                });
              } else {
                core.setFailed(`Sync failed: ${error.message}`);
              }
            }
